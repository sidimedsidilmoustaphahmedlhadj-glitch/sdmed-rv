<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>HistoMaster</title>

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #09090b;
      color: white;
      font-family: Arial, sans-serif;
      min-height: 100vh;
    }

    header {
      text-align: center;
      padding: 40px 20px;
    }

    header h1 {
      font-size: 60px;
      font-weight: bold;
    }

    header p {
      margin-top: 10px;
      color: #a1a1aa;
    }

    main {
      display: flex;
      justify-content: center;
      padding: 20px;
    }

    .quiz-box {
      width: 100%;
      max-width: 800px;
      background: #18181b;
      border-radius: 25px;
      padding: 30px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      margin-bottom: 30px;
      color: #a1a1aa;
      font-size: 18px;
    }

    #question {
      margin-bottom: 25px;
      line-height: 1.5;
      font-size: 28px;
    }

    .answer-btn {
      width: 100%;
      background: #27272a;
      color: white;
      border: none;
      margin-bottom: 15px;
      padding: 18px;
      border-radius: 15px;
      cursor: pointer;
      text-align: left;
      font-size: 16px;
      transition: 0.2s;
    }

    .answer-btn:hover {
      background: #3f3f46;
    }

    .correct {
      background: green !important;
    }

    .wrong {
      background: crimson !important;
    }

    #next-btn {
      width: 100%;
      padding: 18px;
      border: none;
      background: white;
      color: black;
      font-weight: bold;
      border-radius: 15px;
      cursor: pointer;
      margin-top: 20px;
      font-size: 18px;
    }

    .final-score {
      text-align: center;
      font-size: 40px;
      margin-top: 30px;
    }

  </style>

</head>

<body>

<header>
  <h1>HistoMaster</h1>
  <p>Histology Quiz Platform</p>
</header>

<main>

  <div class="quiz-box">

    <div class="top-bar">

      <span id="question-number">
        Question 1
      </span>

      <span id="score">
        Score: 0
      </span>

    </div>

    <h2 id="question">
      Loading...
    </h2>

    <div id="answers"></div>

    <button id="next-btn">
      Next Question
    </button>

  </div>

</main>

<script>

const quizzes = [

  {
    question: "Quel est le collagène le plus abondant dans l’organisme ?",
    answers: [
      "Type I",
      "Type II",
      "Type III",
      "Type IV"
    ],
    correct: 0
  },

  {
    question: "Le tissu cartilagineux est :",
    answers: [
      "Très vascularisé",
      "Avasculaire",
      "Calcifié",
      "Riche en fibres musculaires"
    ],
    correct: 1
  },

  {
    question: "Quelle cellule produit les fibres collagènes ?",
    answers: [
      "Macrophage",
      "Fibroblaste",
      "Mastocyte",
      "Lymphocyte"
    ],
    correct: 1
  },

  {
    question: "Le cartilage hyalin contient principalement :",
    answers: [
      "Collagène I",
      "Collagène II",
      "Fibres élastiques",
      "Kératine"
    ],
    correct: 1
  },

  {
    question: "Le tissu adipeux brun sert principalement à :",
    answers: [
      "Stocker le calcium",
      "Produire la chaleur",
      "Former le cartilage",
      "Synthétiser le collagène"
    ],
    correct: 1
  },

  {
    question: "Les adipocytes de la graisse blanche sont :",
    answers: [
      "Multiloculaires",
      "Uniloculaires",
      "Sans noyau",
      "Calcifiés"
    ],
    correct: 1
  },

  {
    question: "Le périchondre sert à :",
    answers: [
      "Nourrir le cartilage",
      "Former le sang",
      "Produire des neurones",
      "Stocker les lipides"
    ],
    correct: 0
  },

  {
    question: "Le fibrocartilage se trouve dans :",
    answers: [
      "Le nez",
      "Le pavillon de l’oreille",
      "Les disques intervertébraux",
      "La trachée"
    ],
    correct: 2
  },

  {
    question: "Le cartilage élastique contient :",
    answers: [
      "Beaucoup de fibres élastiques",
      "Des ostéocytes",
      "Du sang",
      "Du tissu musculaire"
    ],
    correct: 0
  },

  {
    question: "Le sang est constitué de :",
    answers: [
      "Plasma uniquement",
      "Éléments figurés uniquement",
      "Plasma et éléments figurés",
      "Cartilage"
    ],
    correct: 2
  },

  {
    question: "Les globules rouges sont appelés :",
    answers: [
      "Leucocytes",
      "Hématies",
      "Plaquettes",
      "Monocytes"
    ],
    correct: 1
  },

  {
    question: "Les cellules souches hématopoïétiques sont :",
    answers: [
      "Totipotentes",
      "Musculaires",
      "Cartilagineuses",
      "Nerveuses"
    ],
    correct: 0
  },

  {
    question: "Le cartilage articulaire est nourri par :",
    answers: [
      "Le liquide synovial",
      "Les artères",
      "Les veines",
      "Le plasma"
    ],
    correct: 0
  },

  {
    question: "La graisse brune est abondante chez :",
    answers: [
      "Le nourrisson",
      "Le vieillard",
      "Le sportif",
      "Le diabétique"
    ],
    correct: 0
  },

  {
    question: "Les chondrocytes sont logés dans :",
    answers: [
      "Les ostéones",
      "Les chondroplastes",
      "Les capillaires",
      "Les vacuoles"
    ],
    correct: 1
  }

];

const questionElement =
  document.getElementById("question");

const answersElement =
  document.getElementById("answers");

const nextBtn =
  document.getElementById("next-btn");

const scoreElement =
  document.getElementById("score");

const questionNumber =
  document.getElementById("question-number");

let currentQuestion = 0;
let score = 0;

function loadQuestion() {

  answersElement.innerHTML = "";

  const q = quizzes[currentQuestion];

  questionNumber.innerText =
    `Question ${currentQuestion + 1}`;

  questionElement.innerText =
    q.question;

  q.answers.forEach((answer, index) => {

    const btn =
      document.createElement("button");

    btn.innerText = answer;

    btn.classList.add("answer-btn");

    btn.onclick = () =>
      checkAnswer(index);

    answersElement.appendChild(btn);

  });

}

function checkAnswer(index) {

  const q = quizzes[currentQuestion];

  const buttons =
    document.querySelectorAll(".answer-btn");

  buttons.forEach((btn, i) => {

    btn.disabled = true;

    if (i === q.correct) {
      btn.classList.add("correct");
    }

    if (i === index &&
        i !== q.correct) {
      btn.classList.add("wrong");
    }

  });

  if (index === q.correct) {

    score++;

    scoreElement.innerText =
      `Score: ${score}`;

  }

}

nextBtn.onclick = () => {

  currentQuestion++;

  if (currentQuestion >= quizzes.length) {

    document.querySelector(".quiz-box").innerHTML = `
      <div class="final-score">
        🎉 Quiz Finished <br><br>
        Final Score: ${score}/${quizzes.length}
      </div>
    `;

    return;
  }

  loadQuestion();

};

loadQuestion();

</script>

</body>
</html>
